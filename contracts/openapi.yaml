          description: Report stored until `retentionExpiresAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/deletion:
    post:
      operationId: requestAccountDeletion
      summary: Delete my account
      description: >-
        Requires reauthentication with the current password. Immediately revokes every session and asks every
        node to remove the account's peers; account data is then deleted or anonymized on the documented schedule
        (team pack 04). The caller's tokens stop working once this returns, so the response is the last status
        the client can show. Deleting the account does not cancel a Google Play subscription (M10); the client
        links to Play subscription management instead.
      tags: [Account deletion]
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`reauthentication_failed`: the current password is wrong.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /billing/play/verify:
    post:
      operationId: verifyPlayPurchase
      summary: Verify a Google Play purchase (future, M10)
      description: >-
        Future (M10): not implemented, and behind a feature flag until owner approval. The backend verifies the
        purchase token with Google Play, acknowledges it, links it to exactly one account and derives the
        entitlement from the verified state. The app never sends, and the API never accepts, a premium flag or an
        expiry date: the request schema rejects unknown fields. A token already linked to another account returns
        409 and grants nothing (replay protection). Play notifications and scheduled reconciliation update the
        state server-side and are not part of this client contract.
      tags: [Billing]
      x-milestone: M10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayPurchaseVerificationRequest'
      responses:
        '200':
          description: Verified purchase state and the resulting entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayPurchaseVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`purchase_already_linked`: the token belongs to another account.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: Google Play could not be reached; nothing is granted.
        default:
          $ref: '#/components/responses/UnexpectedError'

