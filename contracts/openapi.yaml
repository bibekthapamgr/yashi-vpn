openapi: 3.1.0
info:
  title: Yashi VPN API
  version: 0.1.0-draft
  summary: Control-plane API for the Yashi VPN Android app, public website, customer portal and admin portal.
  description: |
    **Draft for review by the Android, backend and ops leads at the M01 gate** (team pack M01, task 7).
    Only `GET /health` is implemented (`api/src/app.ts`). Every other operation is a proposal, built in the
    milestone named by its `x-milestone` extension, and may change during review.

    Rules from team pack 03 ("Proposed API contract") that apply to every operation:

    - Version `/v1`. JSON only: request and response bodies are `application/json`.
    - Timestamps are UTC ISO 8601 date-times with a `Z` suffix.
    - Byte values are `int64` integers in bytes and stay within the JavaScript safe-integer range.
      1 GiB = 1,073,741,824 bytes.
    - Lists use cursor pagination: `cursor` and `limit` query parameters; responses return `items` and
      `nextCursor` (null on the last page).
    - Every 4xx and 5xx response uses the shared `Error` body: `code`, safe `message`, `requestId` and
      optional `retryAfter`. No stack traces or secrets. Clients show localized copy for `code`.
    - Every response carries a server-generated `X-Request-Id` and `Cache-Control: no-store`.
    - Ownership is checked server-side on every object. Objects that belong to another account return 404.
    - Customer endpoints use `customerBearer`. `/admin/*` uses the separate `adminSession` scheme. Every admin
      mutation needs a `reason` and an `Idempotency-Key`; `x-admin-roles` lists the roles allowed to call an
      admin operation and `x-step-up-required` marks disruptive ones.
    - Pending node work is never reported as complete. Clients poll status resources with backoff and jitter.
    - No operation accepts or returns a device private key.

    Text marked **Proposed** is a design choice that the team pack does not fix.
servers:
  - url: https://api.example.com/v1
    description: Placeholder. No domain has been approved or purchased (team pack 00); replace once the owner approves one.
security:
  - customerBearer: []
tags:
  - name: Health
    description: Liveness check. The only operation implemented in M01.
  - name: Auth
    description: Registration, email verification, sign-in, token rotation and password reset. Rate limited. Responses never reveal whether an email address has an account.
  - name: Account
    description: The signed-in customer's account, entitlement and authoritative usage.
  - name: Password and sessions
    description: Password change with reauthentication, and the customer's own sign-in sessions.
  - name: Privacy
    description: Privacy choices, enforced server-side and recorded with the privacy-text version.
  - name: Devices
    description: Device enrollment with a public key only, and revocation that removes real node access.
  - name: Locations
    description: Sanitized public catalog of VPN locations.
  - name: Leases
    description: Short-lived, idempotent peer leases that authorize one device on one VPN node.
  - name: Status
    description: Public, sanitized service status and current incidents.
  - name: Beta interest
    description: Public, consented beta signup used before the Play listing is live.
  - name: Support
    description: Support tickets scoped to their owner.
  - name: Diagnostics
    description: Opt-in, redacted diagnostics reports sent only after an in-app preview and explicit consent.
  - name: Account deletion
    description: Authenticated account deletion with immediate session and peer revocation.
  - name: Billing
    description: Future (M10). Google Play purchase verification. Not implemented; stays behind a feature flag until owner approval.
  - name: Admin users
    description: Customer accounts as seen by staff. Emails are masked by default; no password, key, token or traffic views and no impersonation.
  - name: Admin devices
    description: Staff revocation of customer devices.
  - name: Admin nodes
    description: VPN node fleet state, drain and emergency revocation. No cloud credentials or node private keys are exposed.
  - name: Admin plans
    description: Immutable, versioned plan configuration.
  - name: Admin audit
    description: Append-only record of administrative access and changes (actor, action, object, reason, UTC time). No traffic destinations.
  - name: Admin incidents
    description: Incident drafting and publishing for the public status page.
  - name: Admin operations
    description: Status resources for asynchronous admin operations that wait for node-agent acknowledgement.
x-tagGroups:
  - name: Public
    tags: [Health, Status, Locations, Beta interest]
  - name: Customer
    tags: [Auth, Account, Password and sessions, Privacy, Devices, Leases, Support, Diagnostics, Account deletion, Billing]
  - name: Admin
    tags: [Admin users, Admin devices, Admin nodes, Admin plans, Admin audit, Admin incidents, Admin operations]

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Implemented in M01 (`api/src/app.ts`). Reports that the API process is up; it does not check dependencies. The 429 response is Proposed (edge rate limiting) and not implemented yet.
      tags: [Health]
      security: []
      x-milestone: M01
      responses:
        '200':
          description: The API process is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: yashi-api
                version: 0.1.0
                time: '2026-10-15T12:00:00.000Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: >-
        Creates an unverified account and emails a single-use verification token. The response is identical
        whether or not the address already has an account (anti-enumeration). Proposed: the owner of an
        existing account gets a notice email instead. Rate limited per client and per address.
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address
      description: Consumes a single-use email-verification token. Invalid, expired and already-used tokens all return the same 400 `invalid_token`.
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email address verified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/login:
    post:
      operationId: logIn
      summary: Sign in
      description: >-
        Returns a short-lived access token and a rotating refresh token, and creates a session. An unknown
        email and a wrong password return the same 401 `invalid_credentials` (anti-enumeration). Proposed:
        403 `email_not_verified` is returned only after a correct password; suspended accounts can sign in
        (to reach support and deletion) but cannot obtain leases.
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`, identical for unknown emails and wrong passwords.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`email_not_verified` (only after a correct password).'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token
      description: >-
        Exchanges a refresh token for a new access token and a new refresh token; the old refresh token stops
        working. Proposed: presenting an already-rotated refresh token revokes the whole session (reuse detection).
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair. The previous refresh token is no longer valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/logout:
    post:
      operationId: logOut
      summary: Sign out
      description: Revokes the session that the access token belongs to, including its refresh token.
      tags: [Auth]
      x-milestone: M04
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: Emails a single-use reset token if the address has an account. The response is identical either way (anti-enumeration). Rate limited per client and per address.
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: 'Consumes a single-use reset token and sets a new password. Proposed: every session of the account is revoked. Invalid, expired and already-used tokens all return the same 400 `invalid_token`.'
      tags: [Auth]
      security: []
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me:
    get:
      operationId: getMe
      summary: Get the signed-in account
      description: The caller's account. A suspended account still gets 200, so the app can show the Unavailable state.
      tags: [Account]
      x-milestone: M04
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/entitlement:
    get:
      operationId: getMyEntitlement
      summary: Get the current entitlement
      description: Derived by the server from the plan version and, from M10, the verified purchase state. Clients never send entitlement or premium flags.
      tags: [Account]
      x-milestone: M04
      responses:
        '200':
          description: The caller's current entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/usage:
    get:
      operationId: getMyUsage
      summary: Get usage for the current quota period
      description: >-
        Authoritative account-wide quota state for the current period, which starts at 00:00 UTC on the first
        calendar day of the month. Clients show the reset time from `periodEnd` and a stale indicator based on
        `lastMeasuredAt`. Client clocks, reinstalls and app termination never change these values.
      tags: [Account]
      x-milestone: M04
      responses:
        '200':
          description: Usage for the current period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
              example:
                periodStart: '2026-10-01T00:00:00Z'
                periodEnd: '2026-11-01T00:00:00Z'
                quotaBytes: 5368709120
                usedBytes: 1288490189
                remainingBytes: 4080218931
                state: available
                lastMeasuredAt: '2026-10-15T11:58:00Z'
                daily:
                  - date: '2026-10-14'
                    bytes: 1073741824
                  - date: '2026-10-15'
                    bytes: 214748365
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/password:
    post:
      operationId: changePassword
      summary: Change password
      description: Requires reauthentication with the current password. Revokes every other session of the account; the calling session stays signed in.
      tags: [Password and sessions]
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed and other sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`reauthentication_failed`: the current password is wrong.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/sessions:
    get:
      operationId: listMySessions
      summary: List my sessions
      description: 'Active sessions of the caller. Proposed: sessions record only the client type, not IP addresses or user agents.'
      tags: [Password and sessions]
      x-milestone: M04
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: 'Revokes the session and its refresh token. Proposed: the API checks session state on every request, so revoked sessions stop working immediately.'
      tags: [Password and sessions]
      x-milestone: M04
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me/privacy:
    get:
      operationId: getPrivacyChoices
      summary: Get privacy choices
      description: Current value of each privacy choice and the privacy-text version under which it was last set.
      tags: [Privacy]
      x-milestone: M04
      responses:
        '200':
          description: Current choices and the current privacy-text version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyChoices'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: updatePrivacyChoices
      summary: Update privacy choices
      description: >-
        Records each change with the time and the privacy-text version the user saw, and enforces the choice
        server-side wherever the API processes the data. Proposed: 409 `privacy_text_outdated` when
        `privacyTextVersion` is not the current version, so the client shows the current text first.
      tags: [Privacy]
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyChoicesUpdate'
      responses:
        '200':
          description: Updated choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyChoices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`privacy_text_outdated`.'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /devices:
    post:
      operationId: enrollDevice
      summary: Enroll a device
      description: >-
        Registers the WireGuard public key that the device generated locally. The request schema rejects unknown
        fields, so no other key material can be sent. The device-limit check (plan `deviceLimit`; proposed 1 for
        free) runs in the same transaction as the insert. Public keys are unique across all devices (Proposed:
        including revoked devices, so a revoked key can never be enrolled again).
      tags: [Devices]
      x-milestone: M04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollmentRequest'
      responses:
        '201':
          description: Device enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`account_unavailable` (suspended account).'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`device_limit_reached` or `public_key_conflict`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'
    get:
      operationId: listDevices
      summary: List my devices
      description: Active devices and devices with a pending or completed revocation.
      tags: [Devices]
      x-milestone: M04
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      operationId: revokeDevice
      summary: Revoke a device
      description: >-
        Revokes the device and ends its leases. Revocation is complete only when the node acknowledges removal of
        the peer; until then the device shows `revocation_pending`, and `accessEndsBy` is the latest time access can
        continue (the hard lease expiry) if the node is unreachable. Poll `GET /devices`.
      tags: [Devices]
      x-milestone: M04
      responses:
        '200':
          description: Already revoked and confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '202':
          description: Revocation accepted. The device shows `revocation_pending` until the node confirms removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /locations:
    get:
      operationId: listLocations
      summary: List VPN locations
      description: >-
        Public, sanitized catalog derived from node health: no management addresses, provider references,
        credentials or per-node load. Maintenance and capacity states are shown honestly. `measuredAt` and
        `measurementAgeSeconds` describe the server's latest health measurement; this endpoint never reports
        latency (the app measures and timestamps that itself). Used by the app and the public website. Not
        paginated: the catalog is bounded by the fleet size.
      tags: [Locations]
      security: []
      x-milestone: M04
      responses:
        '200':
          description: The current catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCatalog'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /leases:
    post:
      operationId: createLease
      summary: Request a lease
      description: |
        Authorizes one active device of the caller on a node in the chosen location and reserves quota
        account-wide in the same transaction. Provisioning is asynchronous: a 202 does not mean the peer is
        ready. Poll `GET /leases/{id}` with backoff and jitter until `provisioning.state` is `ready`, then connect
        and verify the tunnel. The response holds everything the device needs to compose its WireGuard
        configuration locally with its own key; no key material is sent to the device.

        Grants fail closed: if entitlement, quota or node authorization cannot be validated, the API returns 503
        and grants nothing.

        Proposed switch behaviour: a free account holds one active lease. A new request moves the existing
        lease to `revoking`, and the new lease stays `pending` (`provisioning.reason` is
        `awaiting_previous_revocation`) until the old peer's removal is acknowledged or its hard expiry passes,
        so two peers never overlap. The old lease's unused reservation is returned only then.

        A retry with the same `Idempotency-Key` returns the original response.
      tags: [Leases]
      x-milestone: M04
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRequest'
      responses:
        '202':
          description: Lease created; provisioning is pending.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`quota_exhausted` or `account_unavailable`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The device or location does not exist for this caller.
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`device_not_active`, `location_unavailable` (maintenance or no capacity) or `idempotency_key_reused`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /leases/{id}:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    get:
      operationId: getLease
      summary: Get a lease and its provisioning state
      description: >-
        Desired versus actual node state, with an explicit `provisioning.state` of `pending`, `ready` or `failed`.
        The device may connect only when `state` is `active`, `provisioning.desired` is `present` and
        `provisioning.state` is `ready`. A successful connection still needs the in-tunnel reachability check.
      tags: [Leases]
      x-milestone: M04
      responses:
        '200':
          description: The lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: revokeLease
      summary: End a lease
      description: >-
        Asks the node to remove the peer. The lease stays `revoking` until the node acknowledges removal and ends
        no later than `expiresAt`. A failed disconnect in the app does not return quota; the unused reservation
        returns only after confirmed removal or enforced expiry.
      tags: [Leases]
      x-milestone: M04
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The lease had already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '202':
          description: Revocation in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`idempotency_key_reused`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /leases/{id}/renew:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    post:
      operationId: renewLease
      summary: Renew a lease
      description: >-
        Extends `expiresAt` and, when needed, the quota reservation. Proposed in team pack 03: renew every
        5 minutes, hard lifetime 15 minutes after the latest renewal, tuned after load and reliability tests.
        Fails closed with 503 when authorization cannot be validated; the existing peer then keeps working only
        until `expiresAt`.
      tags: [Leases]
      x-milestone: M04
      parameters:
