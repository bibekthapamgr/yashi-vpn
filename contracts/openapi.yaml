    post:
      operationId: submitDiagnostics
      summary: Upload a redacted diagnostics report
      description: >-
        Opt-in only. The app shows the redacted report to the user and sends it only after explicit consent,
        recorded in `consent`. Reports never contain browsing destinations, DNS queries, packet data, tokens or
        keys. Proposed: the payload uses an allow-list of fields defined in M05 and the server rejects anything
