            type: string
            maxLength: 64
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (UTC).
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: to
          in: query
          required: false
          description: Exclusive upper bound (UTC).
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /admin/incidents:
    get:
      operationId: adminListIncidents
      summary: List incidents
      description: Draft and published incidents, newest first.
      tags: [Admin incidents]
      security:
        - adminSession: []
      x-milestone: M07
      x-admin-roles: [owner, operator, support, read_only]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: adminCreateIncident
      summary: Create an incident
      description: Published incidents appear on `GET /status`; drafts do not.
      tags: [Admin incidents]
      security:
        - adminSession: []
      x-milestone: M07
      x-admin-roles: [owner, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreateRequest'
      responses:
        '201':
          description: Incident created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`idempotency_key_reused`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /admin/incidents/{id}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    patch:
      operationId: adminUpdateIncident
      summary: Update an incident
      description: Changes status, impact or visibility and, when `message` is present, appends a public update. Earlier updates are never edited.
      tags: [Admin incidents]
      security:
        - adminSession: []
      x-milestone: M07
      x-admin-roles: [owner, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdateRequest'
      responses:
        '200':
          description: Incident updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`idempotency_key_reused`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /admin/operations/{id}:
    parameters:
      - $ref: '#/components/parameters/AdminOperationId'
    get:
      operationId: adminGetOperation
      summary: Get an asynchronous admin operation
      description: Status resource returned in the `Location` header of 202 responses. Shows actual node-agent acknowledgements and never reports `completed` early.
      tags: [Admin operations]
      security:
        - adminSession: []
      x-milestone: M07
      x-admin-roles: [owner, operator]
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
      description: >-
        Short-lived access token from `POST /auth/login` or `POST /auth/refresh`, sent in the `Authorization`
        header. Rejected by every `/admin/*` operation. Proposed: the token is opaque to clients.
    adminSession:
      type: apiKey
      in: cookie
      name: yashi_admin_session
      description: >-
        Separate admin authentication for staff `AdminUser` accounts; customer tokens are never accepted. Issued
        only after password and MFA, short-lived and bound to that MFA verification; no shared accounts.
        Proposed: a Secure, HttpOnly, SameSite=Strict cookie (name Proposed) with CSRF protection on every
        mutation. Operations marked `x-step-up-required` also need a recent MFA re-verification, otherwise they
        return 403 `step_up_required`. Admin sign-in, MFA and step-up endpoints are specified in M07.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated key, unique per logical operation (Proposed: a UUID). A retry with the same key and the
        same request returns the original response; reusing the key for a different request returns 409
        `idempotency_key_reused`.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (Proposed default 20, maximum 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SessionId:
      name: id
      in: path
      required: true
      description: Session ID.
      schema:
        type: string
        format: uuid
    DeviceId:
      name: id
      in: path
      required: true
      description: Device ID.
      schema:
        type: string
        format: uuid
    LeaseId:
      name: id
      in: path
      required: true
      description: Lease ID.
      schema:
        type: string
        format: uuid
    TicketId:
      name: id
      in: path
      required: true
      description: Support ticket ID.
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: Customer user ID.
      schema:
        type: string
        format: uuid
    NodeId:
      name: id
      in: path
      required: true
      description: VPN node ID.
      schema:
        type: string
        format: uuid
    IncidentId:
      name: id
      in: path
      required: true
      description: Incident ID.
      schema:
        type: string
        format: uuid
    AdminOperationId:
      name: id
      in: path
      required: true
      description: Admin operation ID.
      schema:
        type: string
        format: uuid

  headers:
    X-Request-Id:
      description: Server-generated request ID, also returned as `requestId` in error bodies. Client-supplied values are ignored.
      required: true
      schema:
        type: string
        format: uuid
    Cache-Control:
      description: Always `no-store`.
      required: true
      schema:
        type: string
        const: no-store
    Retry-After:
      description: Seconds to wait before retrying. Clients add jitter and never retry in a tight loop.
      required: false
      schema:
        type: integer
        minimum: 0
    Location:
      description: URL of the status resource to poll.
      required: true
      schema:
        type: string
        format: uri-reference

  responses:
    GenericAccepted:
      description: Accepted. Identical whether or not the address is known (anti-enumeration).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    AdminOperationAccepted:
      description: Accepted. Poll the operation in the `Location` header until it completes or fails.
      headers:
        Location:
          $ref: '#/components/headers/Location'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminOperation'
    BadRequest:
      description: Malformed JSON or failed validation (`bad_request`, `validation_failed`, `invalid_token`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired credentials (`unauthorized`, `invalid_credentials`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (`forbidden`, `account_unavailable`, `step_up_required` and the codes listed per operation).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or owned by another account. The two cases are indistinguishable (`not_found`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (codes listed per operation).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body over the size limit (`payload_too_large`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited (`rate_limited`). `Retry-After` and `retryAfter` give the wait in seconds.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Fails closed (`service_unavailable`). Nothing new was granted; existing leases keep working only until their `expiresAt`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Any other error, including 5xx (`internal_error`). Same `Error` body; never a stack trace.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: Shared body for every 4xx and 5xx response. Never contains stack traces, secrets or internal details.
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
          description: >-
            Stable machine-readable code that clients map to localized copy. Implemented in M01: `not_found`,
            `bad_request`, `internal_error`. Proposed for M04 onwards: `validation_failed`, `invalid_token`,
            `unauthorized`, `invalid_credentials`, `email_not_verified`, `forbidden`, `account_unavailable`,
            `reauthentication_failed`, `step_up_required`, `quota_exhausted`, `device_limit_reached`,
            `public_key_conflict`, `device_not_active`, `location_unavailable`, `lease_not_active`,
            `idempotency_key_reused`, `privacy_text_outdated`, `payload_too_large`, `purchase_already_linked`,
            `already_suspended`, `not_suspended`, `invalid_lifecycle_state`, `rate_limited`, `service_unavailable`.
        message:
          type: string
          maxLength: 500
          description: Safe, human-readable English summary for logs and support. Not shown as UI copy.
        requestId:
          type: string
          format: uuid
          description: Same value as the `X-Request-Id` response header.
        retryAfter:
          type: integer
          minimum: 0
          description: Seconds to wait before retrying (rate limits and fail-closed outages).
      examples:
        - code: not_found
          message: The requested resource was not found.
          requestId: 3f0c6a52-6a8e-4c1e-9d0b-2f7f1c5b8a10

    Timestamp:
      type: string
      format: date-time
      pattern: 'Z$'
      description: UTC ISO 8601 date-time with a `Z` suffix.
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
      pattern: 'Z$'
      description: UTC ISO 8601 date-time with a `Z` suffix, or null when the event has not happened.
    ByteCount:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: >-
        Bytes (1 GiB = 1,073,741,824 bytes). Values stay within the JavaScript safe-integer range
        (at most 2^53 - 1), so web clients can use plain numbers without precision loss.
    WireGuardPublicKey:
      type: string
      minLength: 44
      maxLength: 44
      pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
      description: WireGuard (Curve25519) public key, base64-encoded 32 bytes.
    LocationId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
      description: Stable location identifier (Proposed format).
    Email:
      type: string
      format: email
      maxLength: 254
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: Proposed policy of 12 to 128 characters, finalized in M04. Never logged or returned.
    CurrentPassword:
      type: string
      minLength: 1
      maxLength: 128
      writeOnly: true
      description: The account's current password, for sign-in or reauthentication. Never logged or returned.
    Tier:
      type: string
      enum: [free, premium]
      description: Plan tier. `premium` is used from M10 only.
    IpAddress:
      type: string
      minLength: 2
      maxLength: 45
      description: IPv4 or IPv6 address in text form.
    Cidr:
      type: string
      minLength: 4
      maxLength: 49
      description: IPv4 or IPv6 prefix in CIDR notation.
    DeviceState:
      type: string
      enum: [active, revocation_pending, revoked]
      description: '`revocation_pending` until every node acknowledges peer removal or the hard lease expiry passes.'
    EntitlementSource:
      type: string
      enum: [free_default, play_subscription, admin_grant]
      description: '`play_subscription` and `admin_grant` (time-bound, permissioned and audited) are M10 only.'
    EntitlementState:
      type: string
      enum: [active, grace, expired, revoked]
      description: Proposed. `grace` covers a Play grace period (M10).
    Cursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; null on the last page.

    Health:
      type: object
      required: [status, service, version, time]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: yashi-api
        version:
          type: string
          description: API build version.
        time:
          $ref: '#/components/schemas/Timestamp'
          description: Server time.
    Accepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, privacyTextVersion]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        privacyTextVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: Proposed. Version of the privacy text the user saw before signing up.
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: Single-use token from an email link. The server stores only its hash.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, clientType]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/CurrentPassword'
        clientType:
          $ref: '#/components/schemas/ClientType'
    ClientType:
      type: string
      enum: [android, web]
      description: Proposed. Shown in the session list instead of IP addresses or user agents.
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
    TokenResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: Short-lived access token.
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        refreshToken:
          type: string
          description: Single-use refresh token, rotated on every refresh. The server stores only its hash.
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        sessionId:
          type: string
          format: uuid
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          $ref: '#/components/schemas/CurrentPassword'
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    Account:
      type: object
      required: [id, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
          description: Verified email address.
        status:
          type: string
          enum: [active, suspended]
          description: A suspended account can sign in, contact support and delete itself, but cannot obtain leases.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Entitlement:
      type: object
      description: Server-derived only; never set from client input.
      required: [planVersionId, tier, quotaBytes, deviceLimit, eligibleLocationIds, source, state, startsAt, endsAt]
      properties:
        planVersionId:
          type: string
          format: uuid
        tier:
          $ref: '#/components/schemas/Tier'
        quotaBytes:
          $ref: '#/components/schemas/ByteCount'
          description: Allowance per monthly period. Proposed free plan 5 GiB (5368709120 bytes).
        deviceLimit:
          type: integer
          minimum: 1
          maximum: 100
          description: Enrolled-device limit. Proposed free plan 1.
        eligibleLocationIds:
          type: array
          items:
            $ref: '#/components/schemas/LocationId'
        source:
          $ref: '#/components/schemas/EntitlementSource'
        state:
          $ref: '#/components/schemas/EntitlementState'
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        endsAt:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Null for open-ended entitlements such as the free plan.
    Usage:
      type: object
      required: [periodStart, periodEnd, quotaBytes, usedBytes, remainingBytes, state, lastMeasuredAt, daily]
      properties:
        periodStart:
          $ref: '#/components/schemas/Timestamp'
          description: 00:00 UTC on the first calendar day of the month.
        periodEnd:
          $ref: '#/components/schemas/Timestamp'
          description: Exclusive end, equal to the next period start. This is the reset time shown to users.
        quotaBytes:
          $ref: '#/components/schemas/ByteCount'
          description: Allowance for this period from the entitlement's plan version.
        usedBytes:
          $ref: '#/components/schemas/ByteCount'
          description: >-
            WireGuard peer RX plus TX counted for this account in this period (disclosed product usage; host egress
            bills are separate). Can exceed `quotaBytes` by at most the documented accounting tolerance
            (proposed 16 MiB).
        remainingBytes:
          $ref: '#/components/schemas/ByteCount'
          description: The larger of `quotaBytes` minus `usedBytes` and zero.
        state:
          type: string
          enum: [available, exhausted]
        lastMeasuredAt:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Time of the newest node measurement included in `usedBytes`; null before the first measurement.
        daily:
          type: array
          description: Aggregate bytes per UTC day of this period, for the portal usage chart. No destinations or per-connection data.
          items:
            type: object
            required: [date, bytes]
            properties:
              date:
                type: string
                format: date
              bytes:
                $ref: '#/components/schemas/ByteCount'

    Session:
      type: object
      required: [id, clientType, createdAt, lastRefreshedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        clientType:
          $ref: '#/components/schemas/ClientType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastRefreshedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: True for the session that made this request.
    SessionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    PrivacySetting:
      type: string
      enum: [crash_reports, diagnostics]
      description: Initial settings named in team pack 03. Adding a setting needs privacy review.
    PrivacyChoice:
      type: object
      required: [setting, value, changedAt, privacyTextVersion]
      properties:
        setting:
          $ref: '#/components/schemas/PrivacySetting'
        value:
          type: boolean
        changedAt:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Null if the user has never changed this setting.
        privacyTextVersion:
          type: [string, 'null']
          description: Privacy-text version shown when the user last changed this setting.
    PrivacyChoices:
      type: object
      required: [currentPrivacyTextVersion, choices]
      properties:
        currentPrivacyTextVersion:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/PrivacyChoice'
    PrivacyChoicesUpdate:
      type: object
      additionalProperties: false
      required: [privacyTextVersion, choices]
      properties:
        privacyTextVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: The privacy-text version shown to the user when making this change.
        choices:
          type: array
          minItems: 1
          maxItems: 10
          description: At most one entry per setting.
          items:
            type: object
            additionalProperties: false
            required: [setting, value]
            properties:
              setting:
                $ref: '#/components/schemas/PrivacySetting'
              value:
                type: boolean

    DeviceEnrollmentRequest:
      type: object
      additionalProperties: false
      description: Public key and label only. Unknown fields are rejected.
      required: [publicKey, label]
      properties:
        publicKey:
          $ref: '#/components/schemas/WireGuardPublicKey'
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: Friendly name chosen by the user.
    Device:
      type: object
      required: [id, label, publicKey, state, enrolledAt, revokedAt, accessEndsBy]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        publicKey:
          $ref: '#/components/schemas/WireGuardPublicKey'
        state:
          $ref: '#/components/schemas/DeviceState'
        enrolledAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When revocation was requested.
        accessEndsBy:
          $ref: '#/components/schemas/NullableTimestamp'
          description: While revocation is pending, the latest time node access can continue (hard lease expiry). Proposed.
    DeviceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    LocationStatus:
      type: string
      enum: [available, maintenance, at_capacity, unavailable]
      description: Proposed. `at_capacity` means new leases are paused because capacity is low.
    Location:
      type: object
      description: Sanitized catalog entry. Never includes node management addresses, provider references or credentials.
      required: [id, countryCode, city, status, eligibleTiers, protocol, measuredAt, measurementAgeSeconds]
      properties:
        id:
          $ref: '#/components/schemas/LocationId'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 code. Clients show a localized country name.
        city:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/LocationStatus'
        eligibleTiers:
          type: array
          items:
            $ref: '#/components/schemas/Tier'
        protocol:
          type: string
          const: wireguard
        measuredAt:
          $ref: '#/components/schemas/Timestamp'
          description: Time of the server's latest health measurement for this location.
        measurementAgeSeconds:
          type: integer
          minimum: 0
          description: Age of that measurement when the response was generated, computed on the server so it does not depend on the device clock.
    LocationCatalog:
      type: object
      required: [generatedAt, locations]
      properties:
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    LeaseRequest:
      type: object
      additionalProperties: false
      required: [deviceId, locationId]
      properties:
        deviceId:
          type: string
          format: uuid
          description: An active device of the caller.
        locationId:
          $ref: '#/components/schemas/LocationId'
    Lease:
      type: object
      required: [id, deviceId, locationId, state, endReason, provisioning, tunnel, renewAfter, expiresAt, createdAt, endedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        locationId:
          $ref: '#/components/schemas/LocationId'
        state:
          type: string
          enum: [active, revoking, ended]
          description: Authorization lifecycle. A free account has at most one `active` lease.
        endReason:
          type: [string, 'null']
          enum: [user_revoked, device_revoked, replaced, expired, quota_exhausted, account_suspended, account_deleted, node_revoked, null]
          description: Why the lease is revoking or ended; null while active (Proposed values).
        provisioning:
          $ref: '#/components/schemas/LeaseProvisioning'
        tunnel:
          description: WireGuard parameters for this lease; null once the lease has ended.
          oneOf:
            - $ref: '#/components/schemas/TunnelParameters'
            - type: 'null'
        renewAfter:
          $ref: '#/components/schemas/Timestamp'
          description: Renew at or after this time (proposed 5 minutes after the grant or latest renewal).
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: Expiry enforced by the server and the node (proposed 15 minutes after the grant or latest renewal). Access ends here even if the control plane is unreachable.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/NullableTimestamp'
    LeaseProvisioning:
      type: object
      description: Desired versus actual peer state on the node.
      required: [state, desired, actual, reason, updatedAt]
      properties:
        state:
          type: string
          enum: [pending, ready, failed]
          description: >-
            `pending`: the node has not yet acknowledged the desired state. `ready`: the node acknowledged it.
            `failed`: the node reported an error or acknowledgement timed out; see `reason`.
        desired:
          type: string
          enum: [present, absent]
          description: Peer state the control plane wants on the node.
        actual:
          type: string
          enum: [present, absent, unknown]
          description: Peer state last acknowledged by the node agent; `unknown` while the agent is unreachable.
        reason:
          type: [string, 'null']
          maxLength: 64
          description: Machine-readable detail when pending or failed, for example `awaiting_node_ack`, `awaiting_previous_revocation`, `node_unreachable` or `node_error` (Proposed values).
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TunnelParameters:
      type: object
      description: >-
        Assigned when the lease is granted. The device composes its WireGuard configuration locally from these values
        and the key pair it generated; nothing here is secret.
      required: [addresses, dns, allowedIps, peer]
      properties:
        addresses:
          type: array
          minItems: 1
          maxItems: 2
          description: Tunnel interface addresses assigned to this device for this lease (IPv4, plus IPv6 if the M03 decision routes IPv6).
          items:
            $ref: '#/components/schemas/Cidr'
        dns:
          type: array
          minItems: 1
          maxItems: 4
          description: Approved DNS resolver addresses, reachable only inside the tunnel.
          items:
            $ref: '#/components/schemas/IpAddress'
        allowedIps:
          type: array
          minItems: 1
          maxItems: 32
          description: Allowed routes (WireGuard AllowedIPs). Full tunnel; IPv6 is either routed or blocked per the M03 decision, never left to escape.
          items:
            $ref: '#/components/schemas/Cidr'
        peer:
          type: object
          required: [publicKey, endpoint]
          properties:
            publicKey:
              $ref: '#/components/schemas/WireGuardPublicKey'
              description: The node's public key.
            endpoint:
              type: string
              maxLength: 261
              description: The node's public UDP tunnel endpoint as host:port. Never a management address.

    StatusLevel:
      type: string
      enum: [operational, degraded, partial_outage, major_outage, maintenance]
    IncidentStatus:
      type: string
      enum: [investigating, identified, monitoring, resolved]
    IncidentImpact:
      type: string
      enum: [degraded_performance, partial_outage, major_outage, maintenance]
    StatusComponentId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
      description: Proposed components are `api`, `accounts`, `website` and one per location ID.
    ServiceStatus:
      type: object
      required: [updatedAt, overall, components, incidents]
      properties:
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        overall:
          $ref: '#/components/schemas/StatusLevel'
        components:
          type: array
          items:
            type: object
            required: [id, name, status, updatedAt]
            properties:
              id:
                $ref: '#/components/schemas/StatusComponentId'
              name:
                type: string
                maxLength: 64
              status:
                $ref: '#/components/schemas/StatusLevel'
              updatedAt:
                $ref: '#/components/schemas/Timestamp'
        incidents:
          type: array
          description: Published incidents that are not yet resolved.
          items:
            $ref: '#/components/schemas/PublicIncident'
    IncidentUpdate:
      type: object
      required: [postedAt, status, message]
      properties:
        postedAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        message:
          type: string
          maxLength: 2000
    PublicIncident:
      type: object
      required: [id, title, status, impact, componentIds, startedAt, updatedAt, resolvedAt, updates]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/IncidentStatus'
        impact:
          $ref: '#/components/schemas/IncidentImpact'
        componentIds:
          type: array
          items:
            $ref: '#/components/schemas/StatusComponentId'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        updates:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/IncidentUpdate'

    BetaInterestRequest:
      type: object
      additionalProperties: false
      required: [email, consentTextVersion]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        consentTextVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the consent text the person agreed to.
        source:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
          description: Where the signup came from, for example `website_home` (Proposed values).

    TicketStatus:
      type: string
      enum: [open, awaiting_customer, closed]
      description: Proposed states.
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required: [subject, message]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 5000
        diagnosticsReportId:
          type: string
          format: uuid
          description: Optional link to the caller's own diagnostics report.
    Ticket:
      type: object
      required: [id, subject, status, createdAt, updatedAt, closedAt, retentionExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        closedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        retentionExpiresAt:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When ticket content will be deleted (proposed 90 days after close); null while open.
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              description: Oldest first.
              items:
                type: object
                required: [id, author, body, createdAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  author:
                    type: string
                    enum: [customer, support]
                    description: Staff replies are shown as `support`, without staff identity.
                  body:
                    type: string
                    maxLength: 5000
                  createdAt:
                    $ref: '#/components/schemas/Timestamp'
    TicketList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    DiagnosticsSubmission:
      type: object
      additionalProperties: false
      required: [appVersion, consent, payload]
      properties:
        deviceId:
          type: string
          format: uuid
          description: The caller's device the report describes, if any.
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
        consent:
          type: object
          additionalProperties: false
          required: [confirmedAt, privacyTextVersion]
          description: Explicit consent given after the in-app preview.
          properties:
            confirmedAt:
              $ref: '#/components/schemas/Timestamp'
            privacyTextVersion:
              type: string
              minLength: 1
              maxLength: 32
        payload:
          type: object
          description: >-
            The redacted report exactly as previewed. Allow-listed fields are defined in M05 (Proposed). Must not
            contain browsing destinations, DNS queries, visited addresses, packet data, tokens or keys.
    DiagnosticsReceipt:
      type: object
      required: [id, receivedAt, retentionExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
        retentionExpiresAt:
          $ref: '#/components/schemas/Timestamp'

    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          $ref: '#/components/schemas/CurrentPassword'
    AccountDeletionReceipt:
      type: object
      required: [requestedAt, sessionsRevoked, accessRevocation, accessEndsBy]
      properties:
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        sessionsRevoked:
          type: boolean
          const: true
          description: Every session and refresh token was revoked before this response.
        accessRevocation:
          type: string
          enum: [confirmed, pending]
          description: Whether every node acknowledged peer removal before the response.
        accessEndsBy:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When `pending`, the latest time node access can continue (hard lease expiry).

    PlayPurchaseVerificationRequest:
      type: object
      additionalProperties: false
      required: [productId, purchaseToken]
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 150
        purchaseToken:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Google Play purchase token. Verified server-side and stored encrypted; staff see only a short reference.
    PlayPurchaseVerificationResult:
      type: object
      required: [subscriptionState, expiresAt, entitlement]
      properties:
        subscriptionState:
          type: string
          enum: [pending, active, in_grace_period, on_hold, canceled, expired, revoked]
          description: Proposed mapping of verified Play states. `canceled` means auto-renew is off but access lasts until `expiresAt`; `revoked` covers refunds and revocations.
        expiresAt:
          $ref: '#/components/schemas/NullableTimestamp'
        entitlement:
          $ref: '#/components/schemas/Entitlement'

    AdminRole:
      type: string
      enum: [owner, operator, support, read_only]
    AdminReason:
      type: string
      minLength: 5
      maxLength: 500
      description: Why the action is taken. Required on every admin mutation and stored in the admin audit. Must not contain secrets or traffic data.
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/AdminReason'
    AdminOperation:
      type: object
      required: [id, kind, targetId, state, progress, errorCode, requestedAt, requestedBy, updatedAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user_suspension, device_revocation, node_drain, node_revocation]
        targetId:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, in_progress, completed, failed]
        progress:
          type: object
          description: >-
            Node work for this operation. Suspension and revocation count peer removals acknowledged by node agents
            or ended by hard lease expiry; drain counts leases ended on the node.
          required: [expected, confirmed, failed]
          properties:
            expected:
              type: integer
              minimum: 0
            confirmed:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        errorCode:
          type: [string, 'null']
          maxLength: 64
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        requestedBy:
          type: string
          format: uuid
          description: AdminUser ID.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'

    CustomerStatus:
      type: string
      enum: [active, suspended, deletion_pending]
    CustomerSearchRequest:
      type: object
      additionalProperties: false
      required: [email, reason]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        reason:
          $ref: '#/components/schemas/AdminReason'
    CustomerSummary:
      type: object
      required: [id, emailMasked, status, tier, createdAt]
      properties:
        id:
          type: string
          format: uuid
        emailMasked:
          type: string
          description: Masked address, for example the first character and the domain only (Proposed format).
        status:
          $ref: '#/components/schemas/CustomerStatus'
        tier:
          $ref: '#/components/schemas/Tier'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerSummary'
        - type: object
          required: [entitlement, usage, devices, supportTickets]
          properties:
            entitlement:
              type: object
              required: [planVersionId, tier, state, source, endsAt]
              properties:
                planVersionId:
                  type: string
                  format: uuid
                tier:
                  $ref: '#/components/schemas/Tier'
                state:
                  $ref: '#/components/schemas/EntitlementState'
                source:
                  $ref: '#/components/schemas/EntitlementSource'
                endsAt:
                  $ref: '#/components/schemas/NullableTimestamp'
            usage:
              type: object
              description: Quota aggregate only.
              required: [periodStart, periodEnd, quotaBytes, usedBytes, lastMeasuredAt]
              properties:
                periodStart:
                  $ref: '#/components/schemas/Timestamp'
                periodEnd:
                  $ref: '#/components/schemas/Timestamp'
                quotaBytes:
                  $ref: '#/components/schemas/ByteCount'
                usedBytes:
                  $ref: '#/components/schemas/ByteCount'
                lastMeasuredAt:
                  $ref: '#/components/schemas/NullableTimestamp'
            devices:
              type: array
              description: No keys or WireGuard configurations.
              items:
                type: object
                required: [id, label, state, enrolledAt, revokedAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  label:
                    type: string
                  state:
                    $ref: '#/components/schemas/DeviceState'
                  enrolledAt:
                    $ref: '#/components/schemas/Timestamp'
                  revokedAt:
                    $ref: '#/components/schemas/NullableTimestamp'
            supportTickets:
              type: array
              description: Ticket history without content.
              items:
                type: object
                required: [id, status, createdAt, closedAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/TicketStatus'
                  createdAt:
                    $ref: '#/components/schemas/Timestamp'
                  closedAt:
                    $ref: '#/components/schemas/NullableTimestamp'
    CustomerList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    NodeLifecycle:
      type: string
      enum: [provisioning, validating, ready, draining, offline, quarantined, retired]
      description: From M07 (provision, validate, ready, drain, offline or replace). `quarantined` follows an emergency revoke (Proposed).
    Node:
      type: object
      description: Operational view. Never includes cloud credentials, management credentials or the node private key.
      required: [id, providerRef, region, city, locationId, publicEndpoint, publicKey, lifecycle, health, lastHeartbeatAt, heartbeatAgeSeconds, maxActiveLeases, activeLeases, activeAccounts, livePeers, recentHandshakes, utilization, transferAllowance]
      properties:
        id:
          type: string
          format: uuid
        providerRef:
          type: string
          maxLength: 128
          description: The hosting provider's identifier for the server. Not a credential.
        region:
          type: string
          maxLength: 64
        city:
          type: string
          maxLength: 64
        locationId:
          $ref: '#/components/schemas/LocationId'
        publicEndpoint:
          type: string
          maxLength: 261
          description: Public UDP tunnel endpoint as host:port.
        publicKey:
          $ref: '#/components/schemas/WireGuardPublicKey'
        lifecycle:
          $ref: '#/components/schemas/NodeLifecycle'
        health:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        lastHeartbeatAt:
          $ref: '#/components/schemas/NullableTimestamp'
        heartbeatAgeSeconds:
          type: [integer, 'null']
          minimum: 0
        maxActiveLeases:
          type: [integer, 'null']
          minimum: 0
          description: Lease cap from measured load tests (M08); null until measured.
        activeLeases:
          type: integer
          minimum: 0
          description: Leases in state `active` on this node (control-plane view).
        activeAccounts:
          type: integer
          minimum: 0
          description: Distinct accounts with an active lease on this node.
        livePeers:
          type: integer
          minimum: 0
          description: Peers present on the node in the latest agent report.
        recentHandshakes:
          type: integer
          minimum: 0
          description: Peers with a recent WireGuard handshake in the latest agent report. Counted separately from peers and accounts.
        utilization:
          type: object
          required: [cpuPercent, networkBitsPerSecond, measuredAt]
          properties:
            cpuPercent:
              type: [number, 'null']
              minimum: 0
              maximum: 100
            networkBitsPerSecond:
              type: [integer, 'null']
              minimum: 0
            measuredAt:
              $ref: '#/components/schemas/NullableTimestamp'
        transferAllowance:
          type: object
          description: Provider transfer allowance. Host billing differs from app quota counts and is never equated with them.
          required: [includedBytes, remainingBytes, isEstimate, billingPeriodStart, billingPeriodEnd]
          properties:
            includedBytes:
              type: [integer, 'null']
              format: int64
              minimum: 0
              maximum: 9007199254740991
            remainingBytes:
              type: [integer, 'null']
              format: int64
              minimum: 0
              maximum: 9007199254740991
            isEstimate:
              type: boolean
              description: True when computed from our own counters rather than the provider's billing data.
            billingPeriodStart:
              $ref: '#/components/schemas/NullableTimestamp'
            billingPeriodEnd:
              $ref: '#/components/schemas/NullableTimestamp'
    NodeList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    PlanVersion:
      type: object
      description: Immutable once created.
      required: [id, tier, version, quotaBytes, deviceLimit, eligibleLocationIds, effectiveFrom, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        tier:
          $ref: '#/components/schemas/Tier'
        version:
          type: integer
          minimum: 1
          description: Increments per tier.
        quotaBytes:
          $ref: '#/components/schemas/ByteCount'
        deviceLimit:
          type: integer
          minimum: 1
          maximum: 100
        eligibleLocationIds:
          type: array
          items:
            $ref: '#/components/schemas/LocationId'
        effectiveFrom:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          type: string
          format: uuid
          description: AdminUser ID.
    PlanVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [tier, quotaBytes, deviceLimit, eligibleLocationIds, effectiveFrom, reason]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        quotaBytes:
          $ref: '#/components/schemas/ByteCount'
        deviceLimit:
          type: integer
          minimum: 1
          maximum: 100
        eligibleLocationIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocationId'
        effectiveFrom:
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/AdminReason'
    PlanVersionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersion'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    AuditObjectType:
      type: string
      enum: [user, device, lease, node, plan_version, incident, admin_user, setting]
      description: Proposed object types.
    AuditEntry:
      type: object
      required: [id, at, actorId, actorRole, action, objectType, objectId, reason, requestId]
      properties:
        id:
          type: string
          format: uuid
        at:
          $ref: '#/components/schemas/Timestamp'
        actorId:
          type: string
          format: uuid
          description: AdminUser ID. Every entry has an individual actor; there are no shared accounts.
        actorRole:
          $ref: '#/components/schemas/AdminRole'
        action:
          type: string
          pattern: '^[a-z_]+\.[a-z_]+$'
          description: For example `user.suspend`, `device.revoke`, `node.drain`, `plan_version.create` or `user.view` (Proposed values).
        objectType:
          $ref: '#/components/schemas/AuditObjectType'
        objectId:
          type: string
          maxLength: 64
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Required for mutations; null for access events.
        requestId:
          type: string
          format: uuid
    AuditEntryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    Incident:
      allOf:
        - $ref: '#/components/schemas/PublicIncident'
        - type: object
          required: [visibility, createdBy]
          properties:
            visibility:
              type: string
              enum: [draft, published]
            createdBy:
              type: string
              format: uuid
              description: AdminUser ID. Never shown publicly.
    IncidentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, status, impact, componentIds, message, visibility, reason]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/IncidentStatus'
        impact:
          $ref: '#/components/schemas/IncidentImpact'
        componentIds:
          type: array
          minItems: 1
          items:
